<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io"></script>
  </head>
  <body>
    <a-scene>
      <!-- Ваша первая панорама -->
      <a-sky id="panorama" src="1.jpg" rotation="0 -90 0"></a-sky>

      <!-- Точка перехода на вторую панораму (сфера в пространстве) -->
      <a-sphere position="2 1 -3" radius="0.3" color="#FF0000" 
                onclick="document.getElementById('panorama').setAttribute('src', '1.jpg')">
      </a-sphere>

      <!-- Курсор-прицел для управления головой/контроллером -->
      <a-camera><a-cursor color="yellow"></a-cursor></a-camera>
    </a-scene>
  </body>
</html>
