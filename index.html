<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR 360 Tour</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <!-- Добавлен компонент cursor для контроллеров -->
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      
      <!-- Ваша первая панорама -->
      <a-sky id="panorama" src="1.jpg" rotation="0 -90 0"></a-sky>

      <!-- Точка перехода на вторую панораму -->
      <a-sphere class="clickable" position="2 1 -3" radius="0.3" color="#FF0000" 
                clickable
                event-set__click="_event: click; _target: #panorama; src: 2.jpg">
      </a-sphere>

      <!-- Компонент для кликов контроллерами -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
      
      <!-- Курсор-прицел для управления головой (для шлемов без контроллеров) -->
      <a-camera>
        <a-cursor color="yellow" raycaster="objects: .clickable"></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
